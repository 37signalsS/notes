[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "Гибридная RAG-система для поиска по markdown-заметкам"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13,<2.14",
    "sentence-transformers>=5.7",
    "qdrant-client>=1.19",
    "fastembed>=0.8",
    "langchain>=1.3",
    "langchain-community>=0.4",
    "langchain-huggingface>=1.2",
    "langchain-text-splitters>=1.1",
    "tqdm>=4.70",
    "pymorphy3>=2.0",
    "pytest>=9.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]