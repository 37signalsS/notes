excluded:
  dirs: [".git", ".obsidian", "venv", "rag_system"]
  # Agent instruction files and their changelog are tooling, not knowledge-base
  # content. Indexing them lets the agent retrieve its own rules as a "source",
  # which defeats §13 (Retrieval Mode) citation auditing.
  files: ["AGENTS.md", "GEMINI.md", "GEMINI1.md", "GEMINI2.md", "MEMORY.md", ".DS_Store"]
  extensions: [".csv", ".doc", ".docx", ".pdf", ".xls", ".xlsx", ".ppt", ".pptx", ".odt", ".ods", ".odp", ".py"]

qdrant:
  mode: server          # "local" (on-disk) or "server" (Qdrant Docker)
  host: localhost
  port: 6333

engines:
  e5:
    dir: qdrant_db
    collection: notes_rag_v2
    model: "intfloat/multilingual-e5-base"
    chunk_size: 2000
    chunk_overlap: 150
    batch_size: 100
    label: "E5"
    query_prefix: "query: "
    doc_prefix: "passage: "
  bge:
    dir: qdrant_bge
    collection: notes_bge
    model: "BAAI/bge-m3"
    chunk_size: 2000
    chunk_overlap: 150
    batch_size: 100
    label: "BGE-M3"
    query_prefix: "Represent this query for searching relevant passages: "
    doc_prefix: "Represent this document for searching relevant passages: "

reranker:
  model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  max_chars: 2048
  score_threshold: -3   # результаты с rerank_score ниже отсекаются

hybrid:
  extra_k_offset: 50

bm25:
  k1: 2.5
  b: 0.75

mmr:
  default_k: 15
  compare_default_k: 30
  lambda: 0.5

hf_hub_timeout: 180

concurrency:
  max_parallel_searches: 4
  max_memory_mb: 10240
